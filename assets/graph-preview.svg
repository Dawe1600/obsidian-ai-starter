<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- App Window Shadow -->
    <filter id="appShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .ui-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; font-size: 10px; fill: #888888; }
    .hub-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #e0e0e0; }
    .pulpit-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  <circle cx="150" cy="120" r="220" fill="#7c3aed" fill-opacity="0.12"/>
  <circle cx="1050" cy="580" r="240" fill="#0284c7" fill-opacity="0.1"/>

  <!-- ============================================================== -->
  <!-- MAIN APPLICATION WINDOW (Obsidian Graph View Window) -->
  <!-- ============================================================== -->
  <g transform="translate(40, 35)" filter="url(#appShadow)">
    <rect width="1120" height="630" rx="10" fill="#141414" stroke="#333333" stroke-width="1"/>

    <!-- 1. Window Titlebar -->
    <rect width="1120" height="38" rx="10" fill="#141414"/>
    <path d="M 0 38 L 1120 38" stroke="#262626" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="20" cy="19" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="19" r="5.5" fill="#ffbd2e"/>
    <circle cx="52" cy="19" r="5.5" fill="#27c93f"/>

    <text x="560" y="24" text-anchor="middle" class="ui-text" font-size="12" font-weight="500" fill="#888888">sejf : Obsidian v1.7.7  |  Graph view</text>

    <!-- ============================================================== -->
    <!-- 2. LEFT RIBBON (width=44px) -->
    <!-- ============================================================== -->
    <g transform="translate(0, 38)">
      <rect width="44" height="592" fill="#161616" stroke="#262626" stroke-width="1"/>

      <!-- Search Icon -->
      <g transform="translate(14, 18)" stroke="#777777" stroke-width="1.6" fill="none">
        <circle cx="6" cy="6" r="4.5"/>
        <line x1="9.5" y1="9.5" x2="13" y2="13"/>
      </g>

      <!-- Graph View Icon (ACTIVE / HIGHLIGHTED) -->
      <g transform="translate(10, 48)">
        <rect x="0" y="0" width="28" height="28" rx="4" fill="#7c3aed" fill-opacity="0.25"/>
        <g transform="translate(4, 4)" stroke="#c4b5fd" stroke-width="1.6" fill="none">
          <circle cx="3" cy="4" r="2" fill="#c4b5fd"/>
          <circle cx="14" cy="3" r="2" fill="#c4b5fd"/>
          <circle cx="9" cy="13" r="2" fill="#c4b5fd"/>
          <line x1="3" y1="4" x2="9" y2="13"/>
          <line x1="14" y1="3" x2="9" y2="13"/>
        </g>
      </g>

      <!-- Canvas Icon -->
      <g transform="translate(14, 88)" stroke="#777777" stroke-width="1.5" fill="none">
        <rect x="2" y="2" width="11" height="11" rx="1.5"/>
        <line x1="2" y1="6" x2="13" y2="6"/>
      </g>

      <!-- Daily Notes Icon -->
      <g transform="translate(14, 122)" stroke="#777777" stroke-width="1.5" fill="none">
        <rect x="2" y="3" width="11" height="10" rx="1.5"/>
        <line x1="2" y1="6" x2="13" y2="6"/>
      </g>

      <!-- Settings Icon -->
      <g transform="translate(14, 555)" stroke="#555555" stroke-width="1.5" fill="none">
        <circle cx="7.5" cy="7.5" r="3"/>
        <path d="M 7.5 1 L 7.5 3 M 7.5 12 L 7.5 14 M 1 7.5 L 3 7.5 M 12 7.5 L 14 7.5"/>
      </g>
    </g>

    <!-- ============================================================== -->
    <!-- 3. GRAPH VIEW TAB AND CANVAS (width=1076px) -->
    <!-- ============================================================== -->
    <g transform="translate(44, 38)">
      <!-- Tab Bar -->
      <rect width="1076" height="34" fill="#181818" stroke="#262626" stroke-width="1"/>

      <!-- Inactive Tab: Pulpit.md -->
      <g transform="translate(12, 12)">
        <text x="0" y="11" class="ui-text" font-size="11" fill="#666666">🎯 Pulpit.md</text>
      </g>

      <!-- Active Tab: Graph view -->
      <g transform="translate(120, 5)">
        <rect width="130" height="29" rx="5" fill="#141414" stroke="#2c2c2c" stroke-width="1"/>
        <g transform="translate(12, 8)" stroke="#a78bfa" stroke-width="1.2" fill="none">
          <circle cx="2" cy="2" r="1.5" fill="#a78bfa"/>
          <circle cx="9" cy="2" r="1.5" fill="#a78bfa"/>
          <circle cx="6" cy="8" r="1.5" fill="#a78bfa"/>
          <line x1="2" y1="2" x2="6" y2="8"/>
          <line x1="9" y1="2" x2="6" y2="8"/>
        </g>
        <text x="32" y="18" class="ui-text" font-size="11" font-weight="600" fill="#e0e0e0">Graph view</text>
        <text x="114" y="18" class="ui-text" font-size="11" fill="#777777">×</text>
      </g>

      <!-- Graph Canvas -->
      <rect y="34" width="1076" height="558" fill="#141414"/>

      <!-- ============================================================== -->
      <!-- EDGES (Natural Force-Directed Web) -->
      <!-- ============================================================== -->
      <g stroke="#282828" stroke-width="1">
        <!-- Pulpit to Main Hubs (Prominent connection lines) -->
        <line x1="520" y1="320" x2="350" y2="210" stroke="#3d3356" stroke-width="1.4"/>
        <line x1="520" y1="320" x2="710" y2="210" stroke="#3d3356" stroke-width="1.4"/>
        <line x1="520" y1="320" x2="360" y2="440" stroke="#3d3356" stroke-width="1.4"/>
        <line x1="520" y1="320" x2="700" y2="430" stroke="#3d3356" stroke-width="1.4"/>

        <!-- Zadania Cluster Edges -->
        <line x1="350" y1="210" x2="250" y2="150"/>
        <line x1="350" y1="210" x2="230" y2="230"/>
        <line x1="350" y1="210" x2="290" y2="280"/>
        <line x1="350" y1="210" x2="390" y2="130"/>
        <line x1="250" y1="150" x2="230" y2="230" stroke="#1f242d"/>

        <!-- Projekty Cluster Edges -->
        <line x1="710" y1="210" x2="820" y2="150"/>
        <line x1="710" y1="210" x2="860" y2="220"/>
        <line x1="710" y1="210" x2="820" y2="280"/>
        <line x1="710" y1="210" x2="730" y2="120"/>
        <line x1="820" y1="150" x2="910" y2="130"/>
        <line x1="860" y1="220" x2="940" y2="240"/>
        <line x1="820" y1="280" x2="890" y2="330"/>

        <!-- Baza Wiedzy Cluster Edges -->
        <line x1="360" y1="440" x2="250" y2="440"/>
        <line x1="360" y1="440" x2="280" y2="520"/>
        <line x1="360" y1="440" x2="350" y2="540"/>
        <line x1="360" y1="440" x2="440" y2="520"/>
        <line x1="250" y1="440" x2="280" y2="520" stroke="#24211b"/>

        <!-- Daily Notes Sequential / Cluster Edges -->
        <line x1="700" y1="430" x2="780" y2="400"/>
        <line x1="700" y1="430" x2="830" y2="450"/>
        <line x1="700" y1="430" x2="800" y2="520"/>
        <line x1="700" y1="430" x2="720" y2="530"/>
        <line x1="780" y1="400" x2="830" y2="450" stroke="#1a2d33"/>
        <line x1="830" y1="450" x2="800" y2="520" stroke="#1a2d33"/>

        <!-- Natural Cross-Link (Project references Knowledge Base note) -->
        <line x1="820" y1="280" x2="440" y2="520" stroke="#2e384e" stroke-width="1.2" stroke-dasharray="3,3"/>
      </g>

      <!-- ============================================================== -->
      <!-- NODES (Organic physics clusters with Obsidian group colors) -->
      <!-- ============================================================== -->
      <!-- Center: Pulpit -->
      <g transform="translate(520, 320)">
        <circle cx="0" cy="0" r="10" fill="#8b5cf6" fill-opacity="0.25"/>
        <circle cx="0" cy="0" r="6" fill="#a78bfa"/>
        <text x="12" y="4" class="pulpit-label">Pulpit</text>
      </g>

      <!-- Hub 1: Zadania (Blue #38bdf8) -->
      <g transform="translate(350, 210)">
        <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
        <text x="10" y="4" class="hub-label">Zadania</text>
      </g>
      <!-- Subnodes -->
      <g transform="translate(250, 150)"><circle cx="0" cy="0" r="3.5" fill="#38bdf8"/><text x="7" y="3" class="node-label">Pilne</text></g>
      <g transform="translate(230, 230)"><circle cx="0" cy="0" r="3.5" fill="#38bdf8"/><text x="7" y="3" class="node-label">Backlog</text></g>
      <g transform="translate(290, 280)"><circle cx="0" cy="0" r="3" fill="#38bdf8"/><text x="7" y="3" class="node-label">Zrobione</text></g>
      <g transform="translate(390, 130)"><circle cx="0" cy="0" r="3" fill="#38bdf8"/><text x="7" y="3" class="node-label">Procedury To-Do</text></g>

      <!-- Hub 2: Projekty (Green #10b981) -->
      <g transform="translate(710, 210)">
        <circle cx="0" cy="0" r="6" fill="#10b981"/>
        <text x="10" y="4" class="hub-label">Projekty</text>
      </g>
      <!-- Subnodes -->
      <g transform="translate(820, 150)"><circle cx="0" cy="0" r="4.5" fill="#10b981"/><text x="8" y="3" class="node-label">Obsidian AI Starter</text></g>
      <g transform="translate(860, 220)"><circle cx="0" cy="0" r="3.5" fill="#10b981"/><text x="8" y="3" class="node-label">Faza 1</text></g>
      <g transform="translate(820, 280)"><circle cx="0" cy="0" r="4" fill="#10b981"/><text x="8" y="3" class="node-label">Architektura</text></g>
      <g transform="translate(730, 120)"><circle cx="0" cy="0" r="3" fill="#10b981"/><text x="7" y="3" class="node-label">Karta Projektu</text></g>
      <g transform="translate(910, 130)"><circle cx="0" cy="0" r="2.8" fill="#10b981"/><text x="6" y="3" class="node-label">Changelog</text></g>
      <g transform="translate(940, 240)"><circle cx="0" cy="0" r="2.5" fill="#10b981"/><text x="6" y="3" class="node-label">Release v1.0</text></g>
      <g transform="translate(890, 330)"><circle cx="0" cy="0" r="2.8" fill="#10b981"/><text x="6" y="3" class="node-label">Deployment</text></g>

      <!-- Hub 3: Baza Wiedzy (Amber #f59e0b) -->
      <g transform="translate(360, 440)">
        <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
        <text x="10" y="4" class="hub-label">Baza Wiedzy</text>
      </g>
      <!-- Subnodes -->
      <g transform="translate(250, 440)"><circle cx="0" cy="0" r="4" fill="#f59e0b"/><text x="8" y="3" class="node-label">Jak korzystać</text></g>
      <g transform="translate(280, 520)"><circle cx="0" cy="0" r="3.5" fill="#f59e0b"/><text x="8" y="3" class="node-label">Procedura Dockera</text></g>
      <g transform="translate(350, 540)"><circle cx="0" cy="0" r="3.2" fill="#f59e0b"/><text x="7" y="3" class="node-label">Git Workflow</text></g>
      <g transform="translate(440, 520)"><circle cx="0" cy="0" r="3.8" fill="#f59e0b"/><text x="8" y="3" class="node-label">Troubleshooting</text></g>

      <!-- Hub 4: Daily Notes (Cyan #06b6d4) -->
      <g transform="translate(700, 430)">
        <circle cx="0" cy="0" r="6" fill="#06b6d4"/>
        <text x="10" y="4" class="hub-label">Daily Notes</text>
      </g>
      <!-- Subnodes -->
      <g transform="translate(780, 400)"><circle cx="0" cy="0" r="3.5" fill="#06b6d4"/><text x="8" y="3" class="node-label">2026-10-18</text></g>
      <g transform="translate(830, 450)"><circle cx="0" cy="0" r="3.5" fill="#06b6d4"/><text x="8" y="3" class="node-label">2026-10-19</text></g>
      <g transform="translate(800, 520)"><circle cx="0" cy="0" r="4" fill="#06b6d4"/><text x="8" y="3" class="node-label">2026-10-20</text></g>
      <g transform="translate(720, 530)"><circle cx="0" cy="0" r="3" fill="#06b6d4"/><text x="7" y="3" class="node-label">Template</text></g>

      <!-- Small floating thoughts / Unlinked or loose notes -->
      <g transform="translate(540, 170)"><circle cx="0" cy="0" r="2.8" fill="#555555"/><text x="6" y="3" class="node-label" fill="#666666">pomysły</text></g>
      <g transform="translate(620, 550)"><circle cx="0" cy="0" r="2.5" fill="#555555"/><text x="6" y="3" class="node-label" fill="#666666">luźne notatki</text></g>

      <!-- ============================================================== -->
      <!-- 4. REALISTIC OBSIDIAN GRAPH CONTROLS PALETTE (TOP-RIGHT) -->
      <!-- ============================================================== -->
      <g transform="translate(840, 48)">
        <!-- Translucent Backdrop -->
        <rect width="216" height="230" rx="6" fill="#181818" fill-opacity="0.88" stroke="#2c2c2c" stroke-width="1"/>

        <!-- Search Input -->
        <g transform="translate(12, 12)">
          <rect width="192" height="24" rx="4" fill="#202020" stroke="#333333" stroke-width="1"/>
          <text x="10" y="16" class="ui-text" font-size="10" fill="#666666">Search files...</text>
        </g>

        <!-- Filters Section -->
        <g transform="translate(14, 52)">
          <path d="M 0 3 L 3 6 L 0 9" stroke="#777777" stroke-width="1.2" fill="none"/>
          <text x="10" y="7" class="ui-text" font-size="10" font-weight="600" fill="#999999">Filters</text>
        </g>

        <!-- Groups Section (Expanded with Real Color Coding) -->
        <g transform="translate(14, 76)">
          <path d="M 0 3 L 4 7 L 8 3" stroke="#aaaaaa" stroke-width="1.2" fill="none"/>
          <text x="12" y="7" class="ui-text" font-size="10" font-weight="600" fill="#cccccc">Groups</text>

          <!-- Group items with colors -->
          <g transform="translate(8, 22)">
            <circle cx="4" cy="4" r="3.5" fill="#10b981"/>
            <text x="14" y="8" class="ui-text" font-size="10" fill="#94a3b8">tag:#projekt</text>
          </g>

          <g transform="translate(8, 42)">
            <circle cx="4" cy="4" r="3.5" fill="#38bdf8"/>
            <text x="14" y="8" class="ui-text" font-size="10" fill="#94a3b8">path:Zadania</text>
          </g>

          <g transform="translate(8, 62)">
            <circle cx="4" cy="4" r="3.5" fill="#f59e0b"/>
            <text x="14" y="8" class="ui-text" font-size="10" fill="#94a3b8">path:Baza Wiedzy</text>
          </g>

          <g transform="translate(8, 82)">
            <circle cx="4" cy="4" r="3.5" fill="#06b6d4"/>
            <text x="14" y="8" class="ui-text" font-size="10" fill="#94a3b8">path:Daily Notes</text>
          </g>
        </g>

        <!-- Display & Forces Section -->
        <g transform="translate(14, 186)">
          <path d="M 0 3 L 3 6 L 0 9" stroke="#777777" stroke-width="1.2" fill="none"/>
          <text x="10" y="7" class="ui-text" font-size="10" font-weight="600" fill="#999999">Display</text>
        </g>

        <g transform="translate(14, 208)">
          <path d="M 0 3 L 3 6 L 0 9" stroke="#777777" stroke-width="1.2" fill="none"/>
          <text x="10" y="7" class="ui-text" font-size="10" font-weight="600" fill="#999999">Forces</text>
        </g>
      </g>
    </g>
  </g>
</svg>
