<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 17px; fill: #ffffff; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #94a3b8; }
    .flow-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #cbd5e1; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="460" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Glow Orbs -->
  <circle cx="180" cy="120" r="240" fill="url(#purpleGlow)" />
  <circle cx="1020" cy="180" r="260" fill="url(#blueGlow)" />

  <!-- Header Section -->
  <g transform="translate(60, 65)">
    <!-- Badges Row -->
    <g transform="translate(0, 0)">
      <!-- Badge 1: Obsidian -->
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" class="badge-text" fill="#c4b5fd">🟣 Obsidian Vault</text>

      <!-- Badge 2: AI Agent -->
      <rect x="142" y="0" width="120" height="28" rx="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
      <text x="202" y="18" text-anchor="middle" class="badge-text" fill="#7dd3fc">⚡ AI Agent Ready</text>

      <!-- Badge 3: Zero Lock-in -->
      <rect x="274" y="0" width="135" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
      <text x="341" y="18" text-anchor="middle" class="badge-text" fill="#6ee7b7">🔒 Zero Lock-in</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title">Obsidian + AI Agent Starter</text>
    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle">Lokalny sejf notatek z autonomicznym asystentem, trwałą pamięcią i czystym grafem wiedzy.</text>
  </g>

  <!-- Architecture Cards Representation -->
  <g transform="translate(60, 230)">
    <!-- Box 1: Warstwa Agenta (.agents/) -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="320" height="175" rx="12" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Header -->
      <rect width="320" height="42" rx="12" fill="#1e3a8a" fill-opacity="0.3"/>
      <circle cx="24" cy="21" r="6" fill="#38bdf8"/>
      <text x="40" y="26" class="card-title">🤖 .agents/ (Mózg Agenta)</text>
      <!-- Details -->
      <text x="24" y="68" class="card-desc">• SOUL.md: Tożsamość i styl komunikacji</text>
      <text x="24" y="94" class="card-desc">• AGENTS.md: Zasady pracy i procedury</text>
      <text x="24" y="120" class="card-desc">• MEMORY.md: Pamięć długoterminowa</text>
      <text x="24" y="146" class="card-desc">• scripts/ &amp; skills/: Automatyzacje</text>
    </g>

    <!-- Center Connection Flow -->
    <g transform="translate(335, 60)">
      <path d="M 15 25 L 85 25" stroke="#6366f1" stroke-width="3" stroke-dasharray="6,4" />
      <polygon points="85,20 95,25 85,30" fill="#6366f1" />
      <path d="M 85 35 L 15 35" stroke="#a855f7" stroke-width="3" stroke-dasharray="6,4" />
      <polygon points="15,40 5,35 15,30" fill="#a855f7" />
      <text x="50" y="12" text-anchor="middle" class="flow-text">Odczyt &amp; Zapis</text>
      <text x="50" y="58" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; fill: #64748b;">Na Twoim dysku</text>
    </g>

    <!-- Box 2: Sejf Obsidian (sejf/) -->
    <g transform="translate(450, 0)" filter="url(#shadow)">
      <rect width="320" height="175" rx="12" fill="url(#boxGrad)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Header -->
      <rect width="320" height="42" rx="12" fill="#581c87" fill-opacity="0.3"/>
      <circle cx="24" cy="21" r="6" fill="#c084fc"/>
      <text x="40" y="26" class="card-title">📓 sejf/ (Twoje Notatki)</text>
      <!-- Details -->
      <text x="24" y="68" class="card-desc">• Pulpit.md: Jedyny centralny hub</text>
      <text x="24" y="94" class="card-desc">• Zadania/: Aktywne to-do i priorytety</text>
      <text x="24" y="120" class="card-desc">• Projekty/ &amp; Baza Wiedzy/</text>
      <text x="24" y="146" class="card-desc">• Daily Notes/: Czysty graf bez pętli</text>
    </g>

    <!-- Box 3: Kluczowe Korzyści -->
    <g transform="translate(790, 0)" filter="url(#shadow)">
      <rect width="290" height="175" rx="12" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
      <!-- Header -->
      <rect width="290" height="42" rx="12" fill="#064e3b" fill-opacity="0.3"/>
      <circle cx="24" cy="21" r="6" fill="#34d399"/>
      <text x="40" y="26" class="card-title">✨ Dlaczego to działa?</text>
      <!-- Details -->
      <text x="20" y="68" class="card-desc">🎯 Czystość: Sejf wolny od logów AI</text>
      <text x="20" y="94" class="card-desc">🕸️ Higiena: Przejrzysty graf powiązań</text>
      <text x="20" y="120" class="card-desc">🧠 Pamięć: AI uczy się z każdą sesją</text>
      <text x="20" y="146" class="card-desc">🚀 Start: Kreator konfiguracji w 3 krokach</text>
    </g>
  </g>
</svg>
